name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Check formatting
        run: cargo fmt -- --check
      
      - name: Run clippy
        run: cargo clippy -- -D warnings
      
      - name: Run tests
        run: cargo test --verbose
      
      - name: Build release
        run: cargo build --release --verbose

  build:
    name: Build Release Binary
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ports-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ports-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ports-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ports-windows-x86_64
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      
      - name: Strip binary
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/ports
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/ports
            target/${{ matrix.target }}/release/ports.exe

  create-tag:
    name: Create and Push Tag
    needs: [test, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      tag_created: ${{ steps.create_tag.outputs.tag_created }}
      new_tag: ${{ steps.create_tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      
      - name: Get latest tag
        id: get_tag
        run: |
          git fetch origin --tags --force
          echo "All tags on remote:"
          git ls-remote --tags origin
          LATEST_TAG=$(git ls-remote --tags origin | grep -oP 'refs/tags/v\K[0-9.]+' | sort -V | tail -n1)
          if [ -z "$LATEST_TAG" ]; then
            echo "No existing tags found, starting with v0.1.0"
            LATEST_TAG="0.0.0"
          fi
          LATEST_TAG="v$LATEST_TAG"
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag determined: $LATEST_TAG"
      
      - name: Determine next version
        id: next_version
        run: |
          LATEST_TAG="${{ steps.get_tag.outputs.latest_tag }}"
          VERSION=${LATEST_TAG#v}
          IFS='.' read -ra VERSION_PARTS <<< "$VERSION"
          MAJOR=${VERSION_PARTS[0]:-0}
          MINOR=${VERSION_PARTS[1]:-0}
          PATCH=${VERSION_PARTS[2]:-0}
          
          # Check commit message for version bump type
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ $COMMIT_MSG =~ ^(BREAKING CHANGE|feat!|fix!): ]] || [[ $COMMIT_MSG =~ BREAKING[[:space:]]CHANGE ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            echo "Bumping MAJOR version due to breaking change"
          elif [[ $COMMIT_MSG =~ ^feat: ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
            echo "Bumping MINOR version due to new feature"
          else
            PATCH=$((PATCH + 1))
            echo "Bumping PATCH version"
          fi
          
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "Next version: $NEW_TAG"
      
      - name: Create and push tag
        id: create_tag
        run: |
          NEW_TAG="${{ steps.next_version.outputs.new_tag }}"
          
          # Check if tag already exists on remote
          if git ls-remote --tags origin | grep -q "refs/tags/$NEW_TAG"; then
            echo "Tag $NEW_TAG already exists on remote, skipping"
            echo "tag_created=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create annotated tag
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          
          # Push tag
          echo "Pushing tag $NEW_TAG to origin..."
          git push origin "$NEW_TAG"
          
          # Verify tag was pushed
          sleep 2
          if git ls-remote --tags origin | grep -q "refs/tags/$NEW_TAG"; then
            echo "✓ Successfully created and pushed tag: $NEW_TAG"
            echo "tag_created=true" >> $GITHUB_OUTPUT
            echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          else
            echo "✗ Failed to push tag: $NEW_TAG"
            exit 1
          fi

  create-release:
    name: Create GitHub Release
    needs: create-tag
    runs-on: ubuntu-latest
    if: needs.create-tag.outputs.tag_created == 'true'
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.create-tag.outputs.new_tag }}
          name: Release ${{ needs.create-tag.outputs.new_tag }}
          # Created as a draft so the `release: published` event (which fans out
          # to the Homebrew/Chocolatey workflows) does not fire until every
          # platform asset has been uploaded. The publish-release job un-drafts it.
          draft: true
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-release-assets:
    name: Upload Release Assets
    needs: [create-tag, create-release]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ports-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ports-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ports-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ports-windows-x86_64
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      
      - name: Strip binary (Unix)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/ports
      
      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz ports
          cd ../../..
      
      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a -tzip ../../../${{ matrix.artifact }}.zip ports.exe
          cd ../../..
        shell: bash
      
      - name: Upload Release Asset (Unix)
        if: matrix.os != 'windows-latest'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.create-tag.outputs.new_tag }}
          files: ${{ matrix.artifact }}.tar.gz
          # Keep the release drafted; otherwise this update would un-draft it
          # mid-upload and publish before the other platforms' assets land.
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset (Windows)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.create-tag.outputs.new_tag }}
          files: ${{ matrix.artifact }}.zip
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish GitHub Release
    needs: [create-tag, upload-release-assets]
    runs-on: ubuntu-latest
    if: needs.create-tag.outputs.tag_created == 'true'
    steps:
      # All assets are uploaded by now. Flipping draft -> published fires the
      # single `release: published` event the packaging workflows wait on.
      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.create-tag.outputs.new_tag }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
